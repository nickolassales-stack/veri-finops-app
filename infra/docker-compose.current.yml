services:
  postgres:
    image: postgres:16
    container_name: finops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops_user
      POSTGRES_PASSWORD: FinopsSenhaForte123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"

  metabase:
    image: metabase/metabase:latest
    container_name: finops-metabase
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: MetabaseSenhaForte123!
      MB_DB_HOST: postgres

volumes:
  postgres_data:
