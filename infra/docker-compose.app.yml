# =============================================================================
# Portal FinOps VERI -- arquivo COMPLEMENTAR de docker compose
# -----------------------------------------------------------------------------
# Este arquivo NAO substitui nem altera o docker-compose.yml em producao.
# Ele apenas ADICIONA o servico `finops-app`. Os servicos existentes
# (postgres e metabase) nao sao redeclarados aqui de proposito: assim nao ha
# risco de recriar ou reconfigurar nenhum deles.
#
# Uso na EC2 FinOps (dentro do diretorio do compose atual, ex. /opt/finops):
#
#   docker compose \
#     -f docker-compose.yml \
#     -f /caminho/do/repo/infra/docker-compose.app.yml \
#     up -d --build finops-app
#
# Informar o nome do servico no final e importante: sem ele o compose avalia
# todos os servicos e pode recriar o Metabase.
#
# ATENCAO -- caminhos relativos: quando se usa varios `-f`, o compose resolve
# caminhos relativos a partir do diretorio do PRIMEIRO arquivo. Por isso o
# contexto de build vem de APP_BUILD_CONTEXT, sempre absoluto.
#
# Variaveis: copie infra/.env.example para `.env` ao lado do docker-compose.yml
# usado no deploy. O `.env` nunca vai para o git.
# =============================================================================

services:
  finops-app:
    image: finops-portal:${APP_IMAGE_TAG:-local}
    build:
      context: ${APP_BUILD_CONTEXT:?defina APP_BUILD_CONTEXT com o caminho absoluto do diretorio web/ do repositorio}
      dockerfile: Dockerfile
    container_name: finops-portal
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: ${APP_TZ:-America/Sao_Paulo}

      # Fala com o Postgres pela rede interna do compose. A porta 5432 continua
      # publicada apenas em 127.0.0.1 pelo compose original -- sem exposicao publica.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-finops}
      PG_USER: ${APP_PG_USER:?defina APP_PG_USER no .env}
      PG_PASSWORD: ${APP_PG_PASSWORD:?defina APP_PG_PASSWORD no .env}
      PG_POOL_MAX: ${APP_PG_POOL_MAX:-5}
      PG_STATEMENT_TIMEOUT_MS: ${APP_PG_STATEMENT_TIMEOUT_MS:-15000}
      APP_TZ: ${APP_TZ:-America/Sao_Paulo}

    # Padrao seguro: acessivel apenas de dentro da EC2 (via tunel SSH para
    # validacao). Para liberar a usuarios de gestao, publique atras de
    # Nginx + HTTPS e restrinja o Security Group -- nao troque para 0.0.0.0
    # sem essa camada na frente.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3000"

    # A EC2 tem ~4 GiB e o Metabase (JVM) ja sofreu OOM nesta instancia.
    # O teto evita que o portal cause regressao no Metabase.
    mem_limit: ${APP_MEM_LIMIT:-512m}

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
